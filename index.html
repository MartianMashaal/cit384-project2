<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GigaPet | CIT 384</title>
    <link rel="icon" href="images/nori.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <script src="vendor/jquery-3.7.1.min.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>GigaPet</h1>
        <p>CIT 384 - Project 2</p>
    </header>

    <main class="pet-card">
        <div class="pet-image-container">
            <img class="pet-image" src="images/nori.svg" width="240" height="240" alt="Nori, an orange cat wearing a green collar">
        </div>

        <section class="dashboard" aria-labelledby="pet-name">
            <h2 id="pet-name" class="name">Nori</h2>
            <div class="pet-stats">
                <p>Weight: <strong class="weight">12</strong> lb</p>
                <p>Happiness: <strong class="happiness">50</strong> / 100</p>
                <p>Tricks learned: <strong class="tricks">0</strong></p>
            </div>

            <div class="button-container">
                <button class="treat-button" type="button">Treat</button>
                <button class="play-button" type="button">Play</button>
                <button class="exercise-button" type="button">Exercise</button>
                <button class="teach-button" type="button">Teach high five</button>
            </div>

            <p class="pet-message" role="status" aria-live="polite">Hi! Is it snack time?</p>
            <p class="care-note">Teach Nori a high five once. Refresh to start over.</p>
        </section>
    </main>

    <footer>Mashaal Jan</footer>
    <noscript><p>Enable JavaScript to play with Nori.</p></noscript>
</body>
</html>
